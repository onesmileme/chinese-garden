spring:
  application:
    name: child-chinese-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/childedu?useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:childedu}
    password: ${DB_PASSWORD:childedu}
    hikari:
      maximum-pool-size: 20 # spec §21：每实例最多 20 连接
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

childedu:
  auth:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    allowed-origins: ${CLIENT_ALLOWED_ORIGINS:}
  platform:
    wechat:
      base-url: ${WECHAT_API_BASE_URL:https://api.weixin.qq.com/}
      app-id: ${WECHAT_APP_ID:}
      secret: ${WECHAT_APP_SECRET:}
    douyin:
      base-url: ${DOUYIN_API_BASE_URL:https://developer.toutiao.com/}
      app-id: ${DOUYIN_APP_ID:}
      secret: ${DOUYIN_APP_SECRET:}
  admin:
    token: ${ADMIN_TOKEN:}
    allowed-ips: ${ADMIN_ALLOWED_IPS:}
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
  content:
    # child-chinese 内容自包含在 frontend/content（非 child_edu/content）。
    root: ${CONTENT_ROOT:../frontend/content}
    import-on-start: false
    import-actor: corpus-v5-migration

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
